<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Клёв</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    html { background: #0E1526; }
    body { max-width: 480px; margin: 0 auto; box-shadow: 0 0 40px rgba(0,0,0,0.5); }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #CFEAF7; color: #23323C;
      display: flex; flex-direction: column; overflow: hidden;
      user-select: none; -webkit-user-select: none; touch-action: manipulation;
    }

    /* ---------- верхняя панель ---------- */
    .top {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; background: linear-gradient(180deg, #121A2E 0%, #1C2740 100%);
      border-bottom: 1px solid rgba(255,255,255,0.08); z-index: 2; color: #EEF2FA;
    }
    .chip {
      display: flex; align-items: center; gap: 6px;
      background: #243150; border-radius: 20px; padding: 6px 12px; color: #EEF2FA;
      font-weight: 700; font-size: 15px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
    }
    .chip button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .coin { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #FFE58A, #E3A008); border: 2px solid #B57A00; }

    .top { flex-wrap: wrap; gap: 6px; padding: 8px 10px; }
    .toprow { display: flex; width: 100%; gap: 5px; align-items: center; min-width: 0; }
    .toprow .chip { padding: 6px 9px; font-size: 14px; flex: none; }
    .toprow .lvlbox { min-width: 0; }
    .chip button.ib { font-size: 17px; }
    #albumBtn { font-size: 13px; gap: 3px; }
    @media (max-width: 380px) {
      .top { padding: 6px 6px; }
      .toprow { gap: 4px; }
      .toprow .chip { padding: 5px 7px; font-size: 12.5px; gap: 4px; }
      .coin { width: 14px; height: 14px; }
      .pearl { width: 13px; height: 13px; }
      .plus { width: 15px; height: 15px; font-size: 12px; }
      .chip button.ib { font-size: 15px; }
      #albumBtn { font-size: 12px; }
    }
    @media (max-width: 345px) { #albumCount { display: none; } .plus { display: none; } }
    .lvlbox { flex: 1; display: flex; align-items: center; gap: 8px; background: #243150; border-radius: 20px; padding: 4px 10px 4px 4px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06); }
    .lvl { min-width: 30px; height: 30px; border-radius: 15px; background: #2F7BD9; color: #FFF; font-weight: 900; display: flex; align-items: center; justify-content: center; font-size: 14px; padding: 0 6px; }
    .xpwrap { flex: 1; }
    .xpbar { height: 8px; border-radius: 4px; background: #121A2E; overflow: hidden; }
    #xpFill { height: 100%; width: 0; background: linear-gradient(90deg, #7CC6E8, #2F7BD9); transition: width 0.4s; }
    #xpText { font-size: 11px; color: #9AA8C2; margin-top: 2px; }
    .chip.en { flex-direction: column; align-items: flex-start; gap: 0; padding: 4px 12px; }
    .chip.en small { font-size: 10px; color: #9AA8C2; font-weight: 600; min-height: 12px; }
    .chip button.ib { font-size: 18px; }
    .pearl { display: inline-block; width: 16px; height: 16px; border-radius: 50%; vertical-align: -3px; background: radial-gradient(circle at 35% 30%, #FFFFFF, #F3E6F0 45%, #C9B3C8); border: 1.5px solid #9C8AA0; }
    .pearl.big { width: 30px; height: 30px; }
    .sp { flex: 1; }
    .plus { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 9px; background: #3FA34D; color: #FFF; font-size: 14px; line-height: 1; }
    #fxBar { position: absolute; left: 8px; top: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 6px; z-index: 1; pointer-events: none; }
    .fx { background: rgba(255,255,255,0.88); border-radius: 12px; padding: 3px 9px; font-size: 12px; font-weight: 700; color: #3A4A55; }
    .fx.gold { background: #FFE9A8; color: #7A5200; }
    #toast { position: fixed; left: 50%; top: 92px; transform: translate(-50%, -10px); background: rgba(20,30,40,0.9); color: #FFF; padding: 10px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; opacity: 0; transition: all 0.25s; z-index: 30; max-width: 90%; text-align: center; pointer-events: none; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    .shop { max-height: 88vh; display: flex; flex-direction: column; text-align: left; }
    .shop h2 { text-align: center; margin-bottom: 8px; }
    .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding-bottom: 8px; }
    .tab { border: none; border-radius: 12px; padding: 8px 4px; text-align: center; background: #EEF3F6; font-weight: 700; font-size: 13px; color: #3A4A55; }
    .tab.on { background: #2F7BD9; color: #FFF; }
    .list { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; align-items: center; gap: 10px; background: #F5F8FA; border-radius: 14px; padding: 10px; border: 2px solid transparent; }
    .row.act { border-color: #3FA34D; background: #EEF8EF; }
    .row.tap { cursor: pointer; }
    .row.tap:active { transform: scale(0.98); }
    .row .tx .cnt { display: inline-block; margin: 0 0 0 4px; padding: 1px 7px; border-radius: 9px; background: #2F7BD9; color: #FFFFFF; font-size: 12px; font-weight: 800; vertical-align: 1px; }
    .card.shop { text-align: left; }
    .card.shop h2 { text-align: center; }
    .state { font-size: 12px; font-weight: 800; color: #2F7BD9; white-space: nowrap; }
    .row.act .state { color: #3FA34D; }
    .row .ic { font-size: 26px; width: 36px; text-align: center; }
    .row .tx { flex: 1; display: flex; flex-direction: column; font-size: 14px; }
    .row .tx span { font-size: 12px; color: #6A7A85; margin-top: 2px; }
    .buy { border: none; border-radius: 12px; padding: 9px 12px; background: #2F7BD9; color: #FFF; font-weight: 800; font-size: 14px; white-space: nowrap; }
    .buy.poor { background: #B7C3CC; }
    .buy:disabled { background: #D6DEE3; color: #7A8A95; }
    .note { font-size: 13px; color: #7A5200; background: #FFF4D6; border-radius: 12px; padding: 8px 10px; margin-bottom: 4px; }
    .sec { font-weight: 800; font-size: 14px; margin-top: 6px; color: #3A4A55; }
    .empty { font-size: 13px; color: #7A8A95; padding: 4px 2px; }
    #luBody div { font-size: 17px; font-weight: 700; margin-top: 8px; }
    .cxp { margin-top: 4px; font-size: 13px; color: #2F7BD9; font-weight: 700; }

    /* ---------- сцена ---------- */
    .scene { position: relative; flex: 1; overflow: hidden; }
    .scene svg.bg { position: absolute; inset: 0; width: 100%; height: 100%; will-change: transform; transform: translateZ(0); }
    #bobber {
      position: absolute; width: 34px; height: 64px; left: 0; top: 0;
      transform: translate(-50%, -80%); transition: transform 0.6s ease-out, opacity 0.2s;
      opacity: 0; pointer-events: none; will-change: transform;
    }
    #bobber.show { opacity: 1; }
    #bobber.bob svg { animation: bob 1.6s ease-in-out infinite; }
    #bobber.nibble svg { animation: nibble 0.35s ease-in-out 2; }
    #bobber.bite svg { animation: bite 0.25s ease-in-out infinite; }
    #bobber.reel svg { animation: reelshake 0.32s ease-in-out infinite; }
    @keyframes reelshake { 0%,100% { transform: translateY(14px) rotate(-16deg); } 50% { transform: translateY(19px) rotate(-6deg); } }
    .rip {
      position: absolute; border-radius: 50%; border: 2.5px solid rgba(255,255,255,0.85);
      transform: translate(-50%, -50%) scale(0.25); opacity: 0; pointer-events: none;
      animation: rip 1.2s ease-out forwards;
    }
    @keyframes rip { 0% { opacity: 0.9; transform: translate(-50%,-50%) scale(0.25); } 100% { opacity: 0; transform: translate(-50%,-50%) scale(1); } }
    .drop {
      position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #EAF8FF;
      pointer-events: none; animation: drop 0.55s ease-out forwards;
    }
    @keyframes drop {
      0% { transform: translate(-50%,-50%); opacity: 1; }
      60% { transform: translate(calc(-50% + var(--dx) * 0.7), calc(-50% + var(--dy))); opacity: 1; }
      100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy) * 0.3)); opacity: 0; }
    }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(4px) rotate(3deg); } }
    @keyframes nibble { 0%,100% { transform: translateY(0); } 50% { transform: translateY(9px); } }
    @keyframes bite { 0%,100% { transform: translateY(20px) rotate(-12deg); } 50% { transform: translateY(28px) rotate(10deg); } }
    #ripple {
      position: absolute; left: 50%; width: 120px; height: 26px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.8); transform: translate(-50%, -50%) scale(0.2);
      opacity: 0; pointer-events: none;
    }
    #ripple.go { animation: ripple 1.2s ease-out; }
    @keyframes ripple { 0% { opacity: 1; transform: translate(-50%,-50%) scale(0.2); } 100% { opacity: 0; transform: translate(-50%,-50%) scale(1.6); } }
    #line { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; will-change: transform; transform: translateZ(0); }

    .bigtext {
      position: absolute; left: 0; right: 0; top: 16%; text-align: center;
      font-size: 34px; font-weight: 900; color: #FFFFFF;
      text-shadow: 0 2px 0 #C2410C, 0 4px 12px rgba(0,0,0,0.25);
      opacity: 0; transform: scale(0.8); transition: all 0.15s; pointer-events: none;
    }
    .bigtext.show { opacity: 1; transform: scale(1); }

    /* ---------- нижняя панель ---------- */
    .panel {
      background: linear-gradient(180deg, #1C2740 0%, #121A2E 100%); border-radius: 22px 22px 0 0; padding: 16px 18px 22px;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.25); z-index: 2; border-top: 1px solid rgba(255,255,255,0.08);
    }
    #status { text-align: center; font-size: 16px; font-weight: 600; min-height: 22px; color: #EEF2FA; }
    #sub { text-align: center; font-size: 13px; color: #9AA8C2; min-height: 18px; margin-top: 4px; }

    .meter { position: relative; height: 26px; border-radius: 13px; background: #2A3654; margin: 14px 0 4px; overflow: hidden; display: none; }
    .meter.show { display: block; }
    #powerFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #7CC6E8, #2F7BD9); }
    #powerZone { position: absolute; top: 0; bottom: 0; left: 72%; width: 16%; background: rgba(63,163,77,0.35); border-left: 2px solid #3FA34D; border-right: 2px solid #3FA34D; }

    #reelTrack { height: 44px; border-radius: 12px; background: linear-gradient(180deg, #4BA3C7, #2B6F92); }
    #reelZone { position: absolute; top: 3px; bottom: 3px; left: 0; width: 30%; will-change: transform; border-radius: 9px; background: rgba(124,220,120,0.55); border: 3px solid #7CDC78; }
    #reelFish { position: absolute; top: 50%; left: 0; width: 40px; height: 22px; transform: translate(-50%, -50%); will-change: transform; }
    #reelFish img { width: 100%; height: 100%; }
    .progress { height: 10px; border-radius: 5px; background: #2A3654; overflow: hidden; margin-top: 8px; display: none; }
    .progress.show { display: block; }
    #progFill { height: 100%; width: 30%; background: linear-gradient(90deg, #F59E0B, #3FA34D); transition: width 0.08s linear; }

    #action {
      display: block; width: 100%; margin-top: 14px; padding: 18px; border: none; border-radius: 16px;
      font-size: 19px; font-weight: 800; color: #FFFFFF; background: #2F7BD9;
      box-shadow: 0 4px 0 #1F5AA6; cursor: pointer; touch-action: none;
    }
    #action:active { transform: translateY(2px); box-shadow: 0 2px 0 #1F5AA6; }
    #action.hot { background: #E8461C; box-shadow: 0 4px 0 #A9300F; }
    #action.green { background: #3FA34D; box-shadow: 0 4px 0 #2B7A36; }

    /* ---------- окна ---------- */
    .modal {
      position: fixed; inset: 0; background: rgba(15,30,40,0.55); display: none;
      align-items: center; justify-content: center; z-index: 10; padding: 18px;
    }
    .modal.show { display: flex; }
    .card {
      width: 100%; max-width: 360px; background: #FFFFFF; border-radius: 22px; padding: 20px;
      text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3); animation: pop 0.25s ease-out;
    }
    @keyframes pop { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .rarity { display: inline-block; padding: 4px 12px; border-radius: 12px; color: #FFFFFF; font-size: 13px; font-weight: 800; letter-spacing: 0.5px; }
    .newtag { display: inline-block; margin-left: 6px; padding: 4px 10px; border-radius: 12px; background: #E8461C; color: #FFFFFF; font-size: 13px; font-weight: 800; }
    .card img.big { width: 100%; max-height: 150px; object-fit: contain; margin: 14px 0 6px; }
    .card h2 { font-size: 24px; }
    .card .w { font-size: 18px; color: #3A4A55; margin-top: 4px; }
    .card .rew { margin-top: 8px; font-size: 16px; font-weight: 700; color: #B57A00; }
    .card .troph { display: none; margin-top: 6px; font-size: 16px; font-weight: 900; color: #FFFFFF; background: #3FA34D; border-radius: 12px; padding: 6px 12px; }
    .card .rec { margin-top: 4px; font-size: 14px; font-weight: 700; color: #3FA34D; min-height: 18px; }
    .card button.main { margin-top: 16px; width: 100%; padding: 16px; border: none; border-radius: 14px; font-size: 18px; font-weight: 800; color: #FFFFFF; background: #2F7BD9; box-shadow: 0 4px 0 #1F5AA6; cursor: pointer; }

    .album { max-height: 88vh; display: flex; flex-direction: column; }
    .album h2 { margin-bottom: 4px; }
    .album .count { color: #7A8A95; font-size: 14px; margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; overflow-y: auto; padding: 2px; }
    .cell { background: #F3F7F9; border-radius: 14px; padding: 8px 6px; border: 2px solid transparent; }
    .cell img { width: 100%; height: 56px; object-fit: contain; }
    .cell.locked img { filter: brightness(0); opacity: 0.25; }
    .cell .n { font-size: 14px; font-weight: 700; margin-top: 4px; }
    .cell .b { font-size: 12px; color: #7A8A95; }
    .cell .t { margin-top: 5px; font-size: 12px; font-weight: 700; color: #7A8A95; background: #E6EEF2; border-radius: 8px; padding: 3px 4px; }
    .cell .t.done { color: #FFFFFF; background: #3FA34D; }
  </style>
</head>
<body>

  <div class="top">
    <div class="toprow">
      <div class="lvlbox"><div class="lvl" id="lvl">1</div><div class="xpwrap"><div class="xpbar"><div id="xpFill"></div></div><div id="xpText">0/10</div></div></div>
      <div class="chip en"><span>⚡ <span id="energy">25/25</span></span><small id="energyTimer"></small></div>
    </div>
    <div class="toprow">
      <div class="chip"><div class="coin"></div><span id="coins">0</span></div>
      <div class="chip"><button id="pearlBtn"><span class="pearl"></span><span id="pearls">0</span><b class="plus">+</b></button></div>
      <div class="sp"></div>
      <div class="chip"><button class="ib" id="bagBtn">🎒</button></div>
      <div class="chip"><button class="ib" id="shopBtn">🛒</button></div>
      <div class="chip"><button id="albumBtn">📖 <span id="albumCount">0/15</span></button></div>
    </div>
  </div>

<script>
/* ================= Данные ================= */
const RARITY = {
  junk:      { name: 'Мусор',       color: '#7A6A55', zone: 0.40, speed: 0.15, chaos: 0.3 },
  common:    { name: 'Обычная',     color: '#8A8F98', zone: 0.34, speed: 0.22, chaos: 0.5 },
  uncommon:  { name: 'Необычная',   color: '#3FA34D', zone: 0.30, speed: 0.30, chaos: 0.7 },
  rare:      { name: 'Редкая',      color: '#2F7BD9', zone: 0.26, speed: 0.38, chaos: 0.9 },
  epic:      { name: 'Эпическая',   color: '#8B4FD6', zone: 0.24, speed: 0.43, chaos: 1.05 },
  legendary: { name: 'Легендарная', color: '#E3A008', zone: 0.23, speed: 0.48, chaos: 1.18 },

// chance — относительный шанс, min/max — вес в кг, price — монет за кг (минимум 1)
// Данные из таблицы «Пруд у деревни — рыбы». chance — относительный шанс, вес в кг, price — монет за рыбу среднего размера
// (форель и осётр убраны из пруда — вернутся в следующих водоёмах)
const FISH = [
  { id: 'karas_serebr', name: 'Карась серебряный', r: 'common',    chance: 100, min: 0.10, max: 2.6, price: 2,   trophy: 1.8 },
  { id: 'plotva',       name: 'Плотва',            r: 'common',    chance: 100, min: 0.05, max: 0.8, price: 2, trophy: 0.6 },
  { id: 'okun',         name: 'Окунь',             r: 'common',    chance: 100, min: 0.05, max: 1.5, price: 2, trophy: 1.1 },
  { id: 'ersh',         name: 'Ёрш',               r: 'common',    chance: 100, min: 0.02, max: 0.8, price: 2,   trophy: 0.45 },
  { id: 'ukleyka',      name: 'Уклейка',           r: 'common',    chance: 100, min: 0.02, max: 0.2, price: 2,  trophy: 0.14 },
  { id: 'karas_zolot',  name: 'Карась золотой',    r: 'uncommon',  chance: 50,  min: 0.20, max: 2.5, price: 5, trophy: 2 },
  { id: 'lin',          name: 'Линь',              r: 'uncommon',  chance: 50,  min: 0.30, max: 3.0, price: 5, trophy: 2.5 },
  { id: 'leshch',       name: 'Лещ',               r: 'uncommon',  chance: 50,  min: 0.50, max: 3.6, price: 5, trophy: 3 },
  { id: 'karp',         name: 'Карп',              r: 'uncommon',  chance: 50,  min: 1.00, max: 12,  price: 5, trophy: 9 },
  { id: 'shchuka',      name: 'Щука',              r: 'rare',      chance: 25,  min: 0.30, max: 8,   price: 12, trophy: 5 },
  { id: 'sudak',        name: 'Судак',             r: 'rare',      chance: 25,  min: 0.30, max: 8,   price: 12, trophy: 5 },
  { id: 'som',          name: 'Сом',               r: 'epic',      chance: 13,  min: 2.00, max: 40,  price: 30, trophy: 25 },
  { id: 'karp_zerk',    name: 'Зеркальный карп',   r: 'epic',      chance: 13,  min: 1.50, max: 20,  price: 30, trophy: 15 },
  { id: 'tsar_shchuka', name: 'Царь-щука',         r: 'legendary', chance: 5,   min: 10,   max: 20,  price: 80,   trophy: 15 },
  { id: 'zolotaya',     name: 'Золотая рыбка',     r: 'legendary', chance: 5,   min: 0.10, max: 0.5, price: 80,  trophy: 0.35 },
];
const JUNK_LIST = [
  { id: 'sapog',   name: 'Старый сапог',     r: 'junk', min: 1.0, max: 1.6, price: 1 },
  { id: 'banka',   name: 'Консервная банка', r: 'junk', min: 0.1, max: 0.3, price: 1 },
  { id: 'koryaga', name: 'Коряга',           r: 'junk', min: 0.3, max: 3.0, price: 1 },
];
const JUNK_CHANCE = 0.05;

// ===== ТЕСТ: ловятся только легендарные (золотая рыбка и царь-щука). Чтобы отключить — поставить false =====
const TEST_ONLY_LEGENDARY = false;
const BAD_LUCK_LIMIT = 40; // столько забросов без редкой и выше — и следующая гарантированно редкая+

/* ================= Сохранение ================= */
const tg = window.Telegram && window.Telegram.WebApp;
const SAVE_KEY = 'klev_save_v1';
let save = { coins: 0, caught: {}, casts: 0, sinceRare: 0 };

function persist() {
  const data = JSON.stringify(save);
  try { localStorage.setItem(SAVE_KEY, data); } catch (e) {}
  try { if (tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9')) tg.CloudStorage.setItem(SAVE_KEY, data); } catch (e) {}
}
function applyLoaded(str) {
  if (!str) return;
  try { const s = JSON.parse(str); if (s && typeof s.coins === 'number') save = Object.assign(save, s); } catch (e) {}
}
// старый «Карась» из первой версии теперь «Карась золотой»
function migrate() {
  if (save.caught && save.caught.karas && !save.caught.karas_zolot) { save.caught.karas_zolot = save.caught.karas; delete save.caught.karas; }
  if (save.trophyN && save.trophyN.karas && !save.trophyN.karas_zolot) { save.trophyN.karas_zolot = save.trophyN.karas; delete save.trophyN.karas; }
}
function load(done) {
  try { applyLoaded(localStorage.getItem(SAVE_KEY)); } catch (e) {}
  try {
    if (tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9')) {
      tg.CloudStorage.getItem(SAVE_KEY, function (err, val) { if (!err && val) applyLoaded(val); done(); });
      return;
    }
  } catch (e) {}
  done();
}

/* ================= Интерфейс ================= */
const $ = (id) => document.getElementById(id);
const action = $('action'), status = $('status'), sub = $('sub');
const bobber = $('bobber'), ripple = $('ripple'), bigtext = $('bigtext');

function haptic(kind) {
  try {
    if (!tg || !tg.HapticFeedback) return;
    if (kind === 'success' || kind === 'error' || kind === 'warning') tg.HapticFeedback.notificationOccurred(kind);
    else tg.HapticFeedback.impactOccurred(kind);
  } catch (e) {}
}
function fmtCoins(n) { return (Math.round(n * 100) / 100).toFixed(2).replace('.', ','); }
function fmtTrophy(w) { return String(Math.round(w * 100) / 100).replace('.', ',') + ' кг'; }
function fmtKg(w) { return (w < 10 ? w.toFixed(2) : w.toFixed(1)).replace('.', ',') + ' кг'; }
function plural(n, a, b, c) { n = Math.abs(n) % 100; const n1 = n % 10; if (n > 10 && n < 20) return c; if (n1 > 1 && n1 < 5) return b; if (n1 === 1) return a; return c; }

function refreshTop() {
  $('coins').textContent = fmtCoins(save.coins);
  const n = FISH.filter(f => save.caught[f.id]).length;
  $('albumCount').textContent = n + '/' + FISH.length;
}

function setLine(show) {
  const p = $('linePath');
  if (!show) { p.setAttribute('d', ''); return; }
  // кончик удочки (300,90) → поплавок. Координаты поплавка переводим в систему viewBox.
  const m = sceneMap();
  const bx = bobVX;
  // верх антенны поплавка; при поклёвке и вываживании поплавок притоплен — леска уходит ниже
  const sink = state === 'reel' ? 16 : state === 'bite' ? 24 : 0;
  const by = bobVY - (19.2 + 32 * bobK - 2 - sink * bobK) / m.s;
  p.setAttribute('d', `M300 90 Q${(300 + bx) / 2} ${Math.max(by, 90) - 10} ${bx} ${by}`);
}

/* ================= Вода: круги и брызги ================= */
let bobX = 50, bobY = 60, bobVX = 200, bobVY = 400, castVY = 400, bobK = 1;
// пересчёт координат картинки в проценты сцены (картинка обрезается по краям экрана)
let _sceneMap = null;
function sceneMap() {
  if (_sceneMap) return _sceneMap;
  const r = $('scene').getBoundingClientRect();
  const s = Math.max(r.width / 400, r.height / 600);
  _sceneMap = { s, ox: (r.width - 400 * s) / 2, oy: (r.height - 600 * s) / 2, w: r.width || 1, h: r.height || 1 };
  if (!r.width) { const m = _sceneMap; _sceneMap = null; return m; }
  return _sceneMap;
}
function visRange() {
  const m = sceneMap();
  const top = -m.oy / m.s, bottom = (m.h - m.oy) / m.s, left = -m.ox / m.s, right = (m.w - m.ox) / m.s;
  // по воде: дальний край пруда ~270, ближний ~505 — но не дальше видимой части экрана
  const far = Math.max(270, top + 60), near = Math.min(500, bottom - 30);
  return { top, bottom, left, right, far: Math.min(far, near - 20), near };
}
function placeBobber(vx, vy) {
  const v = visRange();
  vx = Math.max(v.left + 25, Math.min(v.right - 25, vx));
  vy = Math.max(v.top + 50, Math.min(v.bottom - 15, vy));
  bobVX = vx; bobVY = vy;
  const m = sceneMap();
  bobX = (m.ox + vx * m.s) / m.w * 100;
  bobY = (m.oy + vy * m.s) / m.h * 100;
  // двигаем только через transform — телефону не нужно перерисовывать пруд
  const k = Math.max(0.65, Math.min(1.1, 0.65 + (vy - 260) / 500));
  bobK = k;
  bobber.style.transform = `translate3d(${(m.ox + vx * m.s).toFixed(1)}px, ${(m.oy + vy * m.s).toFixed(1)}px, 0) translate(-50%, -80%) scale(${k.toFixed(3)})`;
}
// чем дальше поплавок (выше на экране), тем меньше круги — перспектива
function depthScale() { return Math.max(0.45, Math.min(1.15, 0.45 + (bobVY - 250) / 300)); }
function spawnRipple(size, dur) {
  const k = depthScale();
  const r = document.createElement('div');
  r.className = 'rip';
  r.style.left = bobX + '%'; r.style.top = bobY + '%';
  r.style.width = (size * k) + 'px'; r.style.height = (size * k * 0.24) + 'px';
  r.style.animationDuration = dur + 'ms';
  $('scene').appendChild(r);
  setTimeout(() => r.remove(), dur + 60);
}
function splash(n, power) {
  const k = depthScale();
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');
    d.className = 'drop';
    d.style.left = bobX + '%'; d.style.top = bobY + '%';
    const sz = (3 + Math.random() * 4) * k;
    d.style.width = sz + 'px'; d.style.height = sz + 'px';
    d.style.setProperty('--dx', ((Math.random() - 0.5) * 60 * power * k) + 'px');
    d.style.setProperty('--dy', (-(12 + Math.random() * 26) * power * k) + 'px');
    $('scene').appendChild(d);
    setTimeout(() => d.remove(), 600);
  }
}

/* --- 3. Клёв --- */
function pickFish() {
  save.casts++;
  if (TEST_ONLY_LEGENDARY) { const L = FISH.filter(f => f.r === 'legendary'); return L[Math.floor(Math.random() * L.length)]; }
  const bait = consumeBait();
  castHeavy = false;
  if (!(bait && bait.noJunk) && Math.random() < JUNK_CHANCE) return JUNK_LIST[Math.floor(Math.random() * JUNK_LIST.length)];
  const guaranteed = save.sinceRare >= BAD_LUCK_LIMIT;
  let pool = FISH.map(f => {
    let c = f.chance;
    if (perfect && f.r !== 'common') c *= 1.4;
    c *= fishMultiplierWith(f, bait);
    if (guaranteed && (f.r === 'common' || f.r === 'uncommon')) c = 0;
    return { f, c };
  });
  const total = pool.reduce((s, p) => s + p.c, 0);
  let x = Math.random() * total;
  let chosen = pool[0].f;
  for (const p of pool) { x -= p.c; if (x <= 0) { chosen = p.f; break; } }
  castHeavy = !!(bait && bait.heavy && bait.heavy.includes(chosen.id));
  return chosen;
}
function fishMultiplierWith(f, bait) {
  let m = 1;
  const gb = gbActive();
  if (gb && gb.boost && gb.boost[f.r]) m *= gb.boost[f.r];
  if (bait && bait.boost && bait.boost[f.r]) m *= bait.boost[f.r];
  if (bait && bait.boostIds && bait.boostIds[f.id]) m *= bait.boostIds[f.id];
  return m;
}

function reelTick(t) {
  if (state !== 'reel') return;
  const dt = Math.min(0.05, (t - reel.last) / 1000);
  reel.last = t;

  // движение рыбы: выбирает цель и плывёт к ней, иногда резко дёргается
  if (t > reel.nextTurn) {
    reel.fishTarget = Math.random();
    reel.nextTurn = t + (900 - reel.chaos * 400) * (0.5 + Math.random());
  }
  const dir = Math.sign(reel.fishTarget - reel.fishX);
  reel.fishX += dir * reel.speed * dt * (0.6 + Math.random() * reel.chaos);
  reel.fishX = Math.max(0.03, Math.min(0.97, reel.fishX));

  // зона игрока: держишь — ускоряется вправо, отпускаешь — влево
  reel.zoneV += (holding ? 7.0 : -7.0) * dt;
  reel.zoneV = Math.max(-1.4, Math.min(1.4, reel.zoneV));
  reel.zoneX += reel.zoneV * dt;
  if (reel.zoneX < 0) { reel.zoneX = 0; reel.zoneV = Math.max(0, reel.zoneV) * 0.3; }
  if (reel.zoneX > 1 - reel.zoneW) { reel.zoneX = 1 - reel.zoneW; reel.zoneV = Math.min(0, reel.zoneV) * 0.3; }

  const inside = reel.fishX >= reel.zoneX && reel.fishX <= reel.zoneX + reel.zoneW;
  reel.progress += (inside ? 0.32 : -0.16 * (save.gear && gearOn('line') ? 0.8 : 1)) * dt;

  if (!reelTrackW) reelTrackW = $('reelMeter').clientWidth || 300;
  $('reelZone').style.transform = `translate3d(${(reel.zoneX * reelTrackW).toFixed(1)}px,0,0)`;
  $('reelFish').style.transform = `translate3d(${(reel.fishX * reelTrackW).toFixed(1)}px,0,0) translate(-50%,-50%) scaleX(${dir < 0 ? -1 : 1})`;
  if (inside !== lastInside) { lastInside = inside; $('reelZone').style.borderColor = inside ? '#7CDC78' : '#F59E0B'; }
  $('progFill').style.width = Math.max(0, Math.min(1, reel.progress)) * 100 + '%';

  // поплавок: чем ближе к поимке, тем ближе к берегу; влево-вправо — куда тянет рыба
  const pr = Math.max(0, Math.min(1, reel.progress));
  const targetY = castVY + (visRange().near - castVY) * pr;
  const targetX = 200 + (reel.fishX - 0.5) * 160;
  placeBobber(bobVX + (targetX - bobVX) * Math.min(1, dt * 4), bobVY + (targetY - bobVY) * Math.min(1, dt * 5));
  setLine(true);

  if (reel.progress >= 1) { cancelAnimationFrame(reelRaf); caught(); return; }
  if (reel.progress <= 0) { cancelAnimationFrame(reelRaf); escaped('Рыба сорвалась!'); return; }
  reelRaf = requestAnimationFrame(reelTick);
}

/* --- Вес рыбы и трофеи ---
   Для каждой рыбы при первой поимке тайно выбирается номер N от 5 до 35.
   До N-й поимки рыба всегда легче трофейного веса, на N-й — гарантированно трофейная.
   После этого трофей может попасться снова, но редко (~4%). */
const TROPHY_FROM = 5, TROPHY_TO = 35;
function rollWeight(f) {
  let k = Math.pow(Math.random(), 1.8);
  if (castHeavy) k = 0.5 + 0.5 * k;
  if (!f.trophy) return f.min + (f.max - f.min) * k;
  if (!save.trophyN) save.trophyN = {};
  if (!save.trophyN[f.id]) save.trophyN[f.id] = TROPHY_FROM + Math.floor(Math.random() * (TROPHY_TO - TROPHY_FROM + 1));
  const prev = save.caught[f.id];
  const catchNo = (prev ? prev.count : 0) + 1;
  const hasTrophy = prev && prev.best >= f.trophy;
  const below = () => f.min + (f.trophy * 0.97 - f.min) * k;
  const above = () => f.trophy + (f.max - f.trophy) * Math.pow(Math.random(), 1.6);
  if (!hasTrophy) return catchNo >= save.trophyN[f.id] ? above() : below();
  return Math.random() < 0.04 ? above() : below();
}

/* Монеты: цена рыбы × размер. Самая мелкая даёт половину цены, самая крупная — вдвое больше,
   трофей ещё ×1,5. Так мелкая, но редкая рыба стоит больше крупной обычной. */
function coinsFor(f, w) {
  if (f.r === 'junk') return f.price;
  const rel = Math.max(0, Math.min(1, (w - f.min) / (f.max - f.min)));
  let c = f.price * (0.5 + 1.5 * rel);
  if (f.trophy && w >= f.trophy) c *= 1.5;
  if (save.passUntil > gameNow()) c *= 1.2;
  return Math.round(c * 100) / 100;   // две цифры после запятой
}

/* --- 5. Результат --- */
function escaped(msg) {
  state = 'result';
  haptic('error');
  const R = RARITY[current ? current.r : 'common'];
  const hint = current && current.r !== 'common' && current.r !== 'junk' ? 'Ушла ' + R.name.toLowerCase() + ' рыба…' : 'Бывает. Попробуй ещё!';
  toIdle(msg, hint);
}

function caught() {
  state = 'result';
  haptic('success');
  const f = current;
  const R = RARITY[f.r];
  // вес: чаще ближе к минимуму, иногда трофей
  const w = rollWeight(f);
  const reward = coinsFor(f, w);

  const isFish = f.r !== 'junk';
  const prev = save.caught[f.id];
  const isNew = isFish && !prev;
  const isRecord = isFish && prev && w > prev.best;
  if (isFish) save.caught[f.id] = { count: (prev ? prev.count : 0) + 1, best: Math.max(w, prev ? prev.best : 0) };
  save.coins = Math.round((save.coins + reward) * 100) / 100;
  if (f.r === 'rare' || f.r === 'epic' || f.r === 'legendary') save.sinceRare = 0; else save.sinceRare++;
  persist();
  refreshTop();

  $('cRarity').textContent = R.name;
  $('cRarity').style.background = R.color;
  $('cNew').style.display = isNew ? 'inline-block' : 'none';
  $('cImg').src = 'fish/' + f.id + '.svg';
  $('cName').textContent = f.name;
  $('cWeight').textContent = fmtKg(w);
  $('cReward').textContent = '+' + fmtCoins(reward) + ' ' + (Number.isInteger(reward) ? plural(reward, 'монета', 'монеты', 'монет') : 'монеты');
  const isTrophy = isFish && f.trophy && w >= f.trophy;
  const firstTrophy = isTrophy && !(prev && prev.best >= f.trophy);
  $('cTrophy').style.display = isTrophy ? 'inline-block' : 'none';
  $('cTrophy').textContent = firstTrophy ? '🏆 ТРОФЕЙ ЗАКРЫТ!' : '🏆 ТРОФЕЙ!';
  const xpRes = catchXp(f, isNew, firstTrophy);
  if (xpRes.xp) addXp(xpRes.xp);
  if (isFish && !save.flags.pondDone && FISH.every(x => save.caught[x.id])) { save.flags.pondDone = true; save.pearls += 50; xpRes.lines.push('+50 жемчуга за всю коллекцию!'); }
  $('cXp').innerHTML = xpRes.lines.join('<br>');
  persist(); refreshTop(); refreshProgress();
  $('cRecord').textContent = isRecord ? 'Новый личный рекорд!' : (f.r === 'junk' ? 'Ну хоть не пусто 🙂' : '');
  $('catchModal').classList.add('show');
  toIdle('Готов к забросу');
}

/* ================= Время с сервера =================

  return Promise.race([req, new Promise(res => setTimeout(res, 3000))]);
}

const PACKS = [ { name: 'Горсть', stars: 50, pearls: 50 }, { name: 'Кошель', stars: 250, pearls: 250 }, { name: 'Сундук', stars: 500, pearls: 500 }, { name: 'Клад', stars: 1000, pearls: 1000 } ];
const ITEM = Object.fromEntries(ITEMS.map(i => [i.id, i]));

function needXp(L) { return Math.round(PROG.XP_BASE * Math.pow(L, PROG.XP_POW)); }
function maxEnergy(L) { return PROG.E1 + (L - 1) * PROG.ESTEP; }
function todayStr(d) { d = d || new Date(gameNow()); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function biteTime() { const h = new Date(gameNow()).getHours(); return BITE_TIMES.find(b => h >= b.from && h < b.to) || null; }
function gbActive() { return save.gb && save.gb.until > gameNow() ? ITEM[save.gb.id] : null; }
function baitActive() { return save.bait && save.bait.id && (save.baitLeft[save.bait.id] || 0) > 0 ? ITEM[save.bait.id] : null; }
function fmtTime(ms) { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

function initProgress() {
  const d = { level: 1, xp: 0, energy: null, energyTs: gameNow(), pearls: 0, inv: {}, gear: {}, gearOn: {}, energyBuyDay: '', baitLeft: {}, bait: null, gb: null,
              passUntil: 0, passDay: '', streak: { day: '', count: 0 }, flags: {} };
  for (const k in d) if (save[k] === undefined) save[k] = d[k];
  if (save.energy === null) save.energy = maxEnergy(save.level);
}

/* --- энергия --- */
function updateEnergy() {
  const now = gameNow(), max = maxEnergy(save.level), step = PROG.REGEN_MIN * 60000;
  if (save.energyTs > now) save.energyTs = now;   // время из будущего (переведённые часы) не засчитываем
  if (save.energy >= max) { save.energyTs = now; return; }
  const gained = Math.floor((now - save.energyTs) / step);
  if (gained > 0) {
    save.energy = Math.min(max, save.energy + gained);
    save.energyTs = save.energy >= max ? now : save.energyTs + gained * step;
  }
}
function spendEnergy() {
  updateEnergy();
  if (save.energy < 1) return false;
  if (save.energy >= maxEnergy(save.level)) save.energyTs = gameNow();
  save.energy -= 1;
  return true;
}
function nextEnergyIn() { return PROG.REGEN_MIN * 60000 - (gameNow() - save.energyTs); }

/* --- опыт и уровни --- */
let pendingLevels = [];
function addXp(n) {
  save.xp += n;
  while (save.xp >= needXp(save.level)) {
    save.xp -= needXp(save.level);
    save.level++;
    updateEnergy();
    const add = maxEnergy(save.level);
    save.energy += add;                                 // к текущей добавляется полный максимум нового уровня
    const coins = save.level * 10;
    save.coins = Math.round((save.coins + coins) * 100) / 100;
    const r = LEVEL_REWARDS[save.level];
    if (r && r.items) for (const id in r.items) save.inv[id] = (save.inv[id] || 0) + r.items[id];
    pendingLevels.push({ level: save.level, energy: add, coins, text: r ? r.text : '' });
  }
}
function showLevelUp() {
  if (!pendingLevels.length) return false;
  const all = pendingLevels; pendingLevels = [];
  const last = all[all.length - 1];
  const energy = all.reduce((s, x) => s + x.energy, 0), coins = all.reduce((s, x) => s + x.coins, 0);
  const extras = all.filter(x => x.text).map(x => x.text);
  $('luTitle').textContent = 'Уровень ' + last.level + '!';
  $('luBody').innerHTML = `<div>⚡ +${energy} энергии</div><div>🪙 +${coins} монет</div>` + extras.map(t => `<div>🎁 ${t}</div>`).join('');
  $('levelModal').classList.add('show');
  haptic('success');
  return true;
}

/* --- ежедневное: серия входов и пропуск --- */
function dailyCheck() {
  const t = todayStr(), y = todayStr(new Date(gameNow() - 86400000));
  const msgs = [];
  if (save.streak.day !== t) {
    save.streak.count = save.streak.day === y ? save.streak.count + 1 : 1;
    save.streak.day = t;
    if (save.streak.count % 7 === 0) { save.pearls += 10; msgs.push('7 дней подряд! +10 жемчуга'); }
  }
  if (save.passUntil > gameNow() && save.passDay !== t) {
    save.passDay = t;
    save.inv.motyl = (save.inv.motyl || 0) + 1;
    save.inv.gb_bread = (save.inv.gb_bread || 0) + 1;
    msgs.push('Пропуск: «Мотыль» и «Хлебная» в рюкзаке');
  }
  if (msgs.length) { persist(); toast(msgs.join(' · ')); }
}

/* --- отображение --- */
function toast(msg) {

  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}
function refreshProgress() {

  $('pearls').textContent = save.pearls;
  // активные эффекты на сцене

  const gb = gbActive(); if (gb) fx.push(`<span class="fx">${gb.icon} ${fmtTime(save.gb.until - gameNow())}</span>`);
  const b = baitActive(); if (b) fx.push(`<span class="fx">${b.icon} ${b.name.replace('Наживка ', '')}: ${save.baitLeft[b.id]}</span>`);
  if (save.passUntil > gameNow()) fx.push('<span class="fx gold">🎫 Пропуск</span>');
  const fxh = fx.join(''); if (fxh !== refreshProgress._fx) { refreshProgress._fx = fxh; $('fxBar').innerHTML = fxh; }
}

/* --- магазин --- */
let shopTab = 'Прикормки';
function canPay(it) { return it.cur === 'coin' ? save.coins >= it.price : save.pearls >= it.price; }
function priceTag(it) { return (it.cur === 'coin' ? '🪙 ' : '<span class="pearl"></span> ') + it.price; }
function openShop(tab) {

      else btn = `<button class="buy${canPay(it) ? '' : ' poor'}" data-buy="${it.id}">${priceTag(it)}</button>`;
      const have = save.inv[it.id] ? ` · в рюкзаке: ${save.inv[it.id]}` : '';
      return `<div class="row"><div class="ic">${it.icon}</div><div class="tx"><b>${it.name}</b><span>${it.desc}${have}</span></div>${btn}</div>`;

function buy(id) {
  const it = ITEM[id];
  if (it.type === 'energy' && save.energyBuyDay === todayStr()) { toast('Полную энергию можно купить раз в сутки'); return; }
  if (!canPay(it)) { toast(it.cur === 'coin' ? 'Не хватает монет' : 'Не хватает жемчуга'); haptic('error'); return; }
  if (it.cur === 'coin') save.coins = Math.round((save.coins - it.price) * 100) / 100; else save.pearls -= it.price;
  if (it.type === 'gear') { save.gear[id] = true; toast(it.name + ' — теперь твоя'); }
  else if (it.type === 'energy') { save.energyBuyDay = todayStr(); updateEnergy(); save.energy = Math.max(save.energy, maxEnergy(save.level)); toast('Энергия полная!'); }
  else if (it.type === 'pass') { save.passUntil = Math.max(gameNow(), save.passUntil) + 30 * 86400000; save.passDay = ''; dailyCheck(); toast('Пропуск активен на 30 дней'); }
  else { save.inv[id] = (save.inv[id] || 0) + 1; toast(it.name + ' — в рюкзаке'); }
  haptic('success'); persist(); refreshTop(); refreshProgress(); openShop();
}

/* --- рюкзак --- */
// показываем только то, что есть; нажатие на строку — активировать / снять
function gearOn(id) { return save.gear[id] && save.gearOn[id] !== false; }
function openBag() {
  const rows = [];
  const badge = (n) => n > 0 ? `<span class="cnt">×${n}</span>` : '';
  // прикормки
  const gbA = gbActive();

  });

    const st = (left ? `На крючке: ${left} забросов` : 'Пачка на 10 забросов') + (on ? '' : ' · ' + it.desc.replace('10 забросов: ', ''));
    rows.push(`<div class="row tap${on ? ' act' : ''}" data-act="bait:${it.id}"><div class="ic">${it.icon}</div><div class="tx"><b>${it.name} ${badge(n)}</b><span>${st}</span></div><span class="state">${on ? 'Насажена' : 'Насадить'}</span></div>`);

    const on = gearOn(it.id);
    rows.push(`<div class="row tap${on ? ' act' : ''}" data-act="gear:${it.id}"><div class="ic">${it.icon}</div><div class="tx"><b>${it.name}</b><span>${it.desc}</span></div><span class="state">${on ? 'Надета' : 'Надеть'}</span></div>`);
  });
  $('bagList').innerHTML = rows.join('');
  $('bagModal').classList.add('show');
}
let confirmReplace = null;
function useGb(id) {
  if (!save.inv[id]) return;
  const it = ITEM[id], cur = gbActive();
  if (cur && cur.id === id) { save.inv[id]--; save.gb.until += it.minutes * 60000; toast(it.name + ': +' + it.minutes + ' минут'); }
  else {
    if (cur && confirmReplace !== id) { confirmReplace = id; toast('Сейчас действует «' + cur.name.replace('Прикормка ', '') + '». Нажми ещё раз, чтобы заменить'); return; }
    confirmReplace = null;
    save.inv[id]--; save.gb = { id, until: gameNow() + it.minutes * 60000 };
    toast(it.name + ' — клюёт быстрее!');
  }
  haptic('light'); persist(); refreshProgress(); openBag();
}
function toggleBait(id) {
  const cur = baitActive();
  if (cur && cur.id === id) { save.bait = null; toast('Наживка снята'); }
  else {
    if (!(save.baitLeft[id] > 0)) { if (!save.inv[id]) return; save.inv[id]--; save.baitLeft[id] = 10; }
    save.bait = { id }; toast(ITEM[id].name + ' на крючке');
  }
  haptic('light'); persist(); refreshProgress(); openBag();
}
function toggleGear(id) {
  save.gearOn[id] = !gearOn(id);
  toast(ITEM[id].name + (save.gearOn[id] ? ' — надета' : ' — снята'));
  haptic('light'); persist(); openBag();
}
function setBait(id) { toggleBait(id); }

/* --- влияние на рыбалку --- */
let castHeavy = false;
function fishMultiplier(f) {
  let m = 1;
  const gb = gbActive(), b = baitActive();
  if (gb && gb.boost && gb.boost[f.r]) m *= gb.boost[f.r];
  if (b && b.boost && b.boost[f.r]) m *= b.boost[f.r];
  if (b && b.boostIds && b.boostIds[f.id]) m *= b.boostIds[f.id];
  return m;
}
function consumeBait() {
  const b = baitActive();
  if (!b) return null;
  save.baitLeft[b.id]--;
  if (save.baitLeft[b.id] <= 0) { save.baitLeft[b.id] = 0; if (save.inv[b.id]) { save.inv[b.id]--; save.baitLeft[b.id] = 10; } else { save.bait = null; toast(b.name + ' закончилась'); } }
  return b;
}
function waitTime() {
  const gb = gbActive();
  if (gb) return gb.wait[0] + Math.random() * (gb.wait[1] - gb.wait[0]);
  return 1800 + Math.random() * 3500;
}
// опыт за улов; возвращает строки для карточки
function catchXp(f, isNew, firstTrophy) {
  if (f.r === 'junk') return { xp: 0, lines: [] };
  const bt = biteTime();
  let base = XP_BY_R[f.r] * (bt ? bt.mult : 1);
  let xp = base;
  const lines = ['+' + base + ' опыта' + (bt ? ' (зорька ×' + bt.mult + ')' : '')];
  if (isNew) { xp += FIRST_XP[f.r]; lines.push('+' + FIRST_XP[f.r] + ' за новый вид'); }
  if (firstTrophy) { xp += PROG.TROPHY_XP; lines.push('+' + PROG.TROPHY_XP + ' за трофей'); save.pearls += 5; lines.push('+5 жемчуга за первый трофей'); }
  return { xp, lines };
}

/* ================= Управление кнопкой ================= */
function onDown(e) {
  e.preventDefault();
  if (state === 'idle') {
    if (!spendEnergy()) {
      status.textContent = 'Энергия закончилась';
      sub.textContent = '+1 через ' + fmtTime(nextEnergyIn()) + ' · или пополни в магазине 🛒';
      haptic('error'); refreshProgress(); return;
    }
    persist(); refreshProgress(); startPower();
  }
  else if (state === 'power') releasePower();
  else if (state === 'waiting') { escaped('Рано подсёк — рыба испугалась'); }
  else if (state === 'bite') startReel();
  else if (state === 'reel') { if (!holding) reel.zoneV *= 0.2; holding = true; }
}
function onUp(e) {
  e.preventDefault();
  if (state === 'reel' && holding) reel.zoneV *= 0.2;  // мгновенный разворот
  holding = false;
}
action.addEventListener('pointerdown', onDown);
action.addEventListener('pointerup', onUp);
action.addEventListener('pointercancel', onUp);
action.addEventListener('pointerleave', (e) => { if (state === 'reel') onUp(e); });
action.addEventListener('contextmenu', (e) => e.preventDefault());

      `<div class="b" style="color:${R.color}">${R.name}</div>` +
      (c ? `<div class="b">Рекорд: ${fmtKg(c.best)} · поймано ${c.count}</div>` : '') +
      `<div class="t${c && c.best >= f.trophy ? ' done' : ''}">${c && c.best >= f.trophy ? '✓ ' : '🏆 '}Трофей: ${fmtTrophy(f.trophy)}</div>`;
    grid.appendChild(el);
  });
  const n = FISH.filter(f => save.caught[f.id]).length;
  const tr = FISH.filter(f => save.caught[f.id] && save.caught[f.id].best >= f.trophy).length;
  $('albumInfo').textContent = 'Собрано ' + n + ' из ' + FISH.length + ' · Трофеев ' + tr + ' из ' + FISH.length;
  $('albumModal').classList.add('show');
}
$('albumBtn').addEventListener('click', openAlbum);
$('albumClose').addEventListener('click', () => $('albumModal').classList.remove('show'));

/* ================= Старт ================= */
if (tg) {
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor('#121A2E'); tg.setBackgroundColor('#F7B98C'); } catch (e) {}
  try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
}
// предзагрузка картинок: держим их в памяти и заранее декодируем, чтобы рыба появлялась мгновенно
const IMG_CACHE = {};
FISH.concat(JUNK_LIST).forEach(f => {
  const i = new Image();
  i.src = 'fish/' + f.id + '.svg';
  if (i.decode) i.decode().catch(() => {});
  IMG_CACHE[f.id] = i;
});

load(() => syncTime().then(() => {
  migrate();
  initProgress();
  dailyCheck();
  refreshTop();
  refreshProgress();
  const user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  toIdle(user && user.first_name ? 'Привет, ' + user.first_name + '!' : 'Привет, рыбак!');
}));
// сцена меняет размер (панель снизу растёт при вываживании) — пересчитываем позицию поплавка
try { new ResizeObserver(() => { _sceneMap = null; placeBobber(bobVX, bobVY); if (state === 'waiting' || state === 'bite' || state === 'reel') setLine(true); }).observe($('scene')); } catch (e) {}
window.addEventListener('resize', () => { _sceneMap = null; placeBobber(bobVX, bobVY); if (state === 'waiting' || state === 'bite' || state === 'reel') setLine(true); });
</script>
</body>
</html>
